[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-reality-check"
version = "1.0.7"
description = "Local-first job-market analysis and explainable application prioritization."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Xixiaogu" }]
dependencies = [
    "fastapi>=0.115,<1",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
desktop = [
    "Pillow>=11,<13",
    "pystray>=0.19,<1",
    "pywebview>=5,<7",
]
build = [
    "PyInstaller>=6,<7",
]

[project.scripts]
job-market-api = "local_api.cli:main"
job-market-desktop = "desktop.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["desktop*", "local_api*", "pipeline*"]
