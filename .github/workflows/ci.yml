name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core:
    name: Windows core, API, desktop, and Skill
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-local-api.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local-api.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Validate browser extension
        working-directory: extension
        run: |
          npm ci
          npm run compile
          npm run build

      - name: Create synthetic CI data
        run: |
          python scripts/create_ci_fixture.py `
            --output .build/ci-fixture/job_market.db

      - name: Run baseline tests
        shell: pwsh
        run: |
          $python = (Get-Command python.exe).Source
          ./run_baseline_tests.ps1 `
            -Version 1.0.7 `
            -PythonPath $python `
            -SourceDatabasePath .build/ci-fixture/job_market.db `
            -SkipPackaged `
            -SkipInstaller

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            .build/baseline-tests/
            local_api/runtime/
          if-no-files-found: ignore
          retention-days: 7
